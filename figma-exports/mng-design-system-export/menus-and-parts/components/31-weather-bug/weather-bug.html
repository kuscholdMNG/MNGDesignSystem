<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather Bug — skeleton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Noto+Serif:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../../tokens.css">
<style>
*{box-sizing:border-box} body{margin:0;padding:24px;background:#f4f4f4;font-family:'Noto Sans',sans-serif;color:#141414}
[hidden]{display:none!important}
.skel-variant{margin:0 0 40px} .skel-variant>h1{font:600 13px/1.4 monospace;color:#555;margin:0 0 8px}
.skel-stage{background:#fff;display:inline-block;outline:1px solid #ddd}
.mng-c-weather-bug__location-sectionmenu{width:300px;min-height:80px;position:relative;display:flex;flex-direction:row;gap:12px;padding:8px 16px 8px 16px;justify-content:flex-start;align-items:center;background:var(--mng-gray-max, #FFFFFF)}
.mng-c-weather-bug__weather{display:flex;flex-direction:row;gap:0px;padding:0px 0px 0px 0px;justify-content:flex-start;align-items:flex-start;position:relative}
.mng-c-weather-bug__c-87-f{font-family:'Helvetica', sans-serif;font-size:16px;font-weight:700;line-height:normal;text-transform:capitalize;color:var(--mng-gray-min, #141414);text-align:left;margin:0}
.mng-c-weather-bug__tornado{width:26px;flex-shrink:0;height:26px;flex-shrink:0;box-sizing:border-box;border:1px dashed #8A8A8A;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#f0f0f0 6px,#f0f0f0 12px);font:11px/1.3 monospace;color:#555;padding:4px;overflow:hidden}
.mng-c-weather-bug__date-and-e-edition{flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:8px;padding:0px 0px 0px 0px;justify-content:flex-start;align-items:flex-start;position:relative}
.mng-c-weather-bug__wednesday-september-25th-2025{align-self:stretch;font-family:'Noto Sans', sans-serif;font-size:15px;font-weight:700;line-height:normal;text-transform:capitalize;color:var(--mng-gray-min, #141414);text-align:left;margin:0}
.mng-c-weather-bug__today-s-e-edition{font-family:'Noto Sans', sans-serif;font-size:12px;font-weight:400;line-height:normal;text-transform:capitalize;color:var(--mng-gray-min, #141414);text-align:left;margin:0}
.mng-c-weather-bug__location-masthead{width:345px;min-height:42px;position:relative;display:flex;flex-direction:row;gap:12px;padding:0px 0px 0px 0px;justify-content:flex-start;align-items:flex-start;background:var(--mng-gray-max, #FFFFFF)}
.mng-c-weather-bug__tornado-2{width:26px;flex-shrink:0;height:26px;flex-shrink:0;box-sizing:border-box;border:1px dashed #8A8A8A;background:repeating-linear-gradient(45deg,#fafafa,#fafafa 6px,#f0f0f0 6px,#f0f0f0 12px);font:11px/1.3 monospace;color:#555;padding:4px;overflow:hidden}
.mng-c-weather-bug__date-and-e-edition-2{display:flex;flex-direction:column;gap:4px;padding:0px 0px 0px 0px;justify-content:flex-start;align-items:flex-start;position:relative}
.mng-c-weather-bug__wednesday-september-25th-2022{font-family:'Noto Sans', sans-serif;font-size:16px;font-weight:700;line-height:normal;text-transform:capitalize;color:var(--mng-gray-min, #141414);text-align:left;margin:0}
</style></head>
<body>
<!-- Structural skeleton generated from Figma auto-layout. Instances are dashed placeholders; open the referenced file to render them. -->
<section class="skel-variant" data-variant="Location=SectionMenu">
  <h1>Weather Bug · Location=SectionMenu · 300×80</h1>
  <div class="skel-stage">
    <div class="mng-c-weather-bug__location-sectionmenu" data-layer="Location=SectionMenu">
      <div class="mng-c-weather-bug__weather" data-layer="Weather">
        <span class="mng-c-weather-bug__c-87-f">87°F</span>
        <!-- instance of "tornado" → not in this export -->
        <div class="mng-c-weather-bug__tornado" data-component="tornado" data-variant="" data-label="tornado">tornado</div>
      </div>
      <div class="mng-c-weather-bug__date-and-e-edition" data-layer="Date and E-Edition">
        <span class="mng-c-weather-bug__wednesday-september-25th-2025">Wednesday, September 25th, 2025</span>
        <span class="mng-c-weather-bug__today-s-e-edition">Today’s E Edition</span>
      </div>
    </div>
  </div>
</section>
<section class="skel-variant" data-variant="Location=Masthead">
  <h1>Weather Bug · Location=Masthead · 345×42</h1>
  <div class="skel-stage">
    <div class="mng-c-weather-bug__location-masthead" data-layer="Location=Masthead">
      <div class="mng-c-weather-bug__weather" data-layer="Weather">
        <span class="mng-c-weather-bug__c-87-f">87°F</span>
        <!-- instance of "tornado" → not in this export -->
        <div class="mng-c-weather-bug__tornado-2" data-component="tornado" data-variant="" data-label="tornado">tornado</div>
      </div>
      <div class="mng-c-weather-bug__date-and-e-edition-2" data-layer="Date and E-Edition">
        <span class="mng-c-weather-bug__wednesday-september-25th-2022">Wednesday, September 25th, 2022</span>
        <span class="mng-c-weather-bug__today-s-e-edition">Today’s E Edition</span>
      </div>
    </div>
  </div>
</section>
</body></html>
